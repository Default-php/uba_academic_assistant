{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-4">Crear Cuenta</h2>
        <form id="register-form" class="space-y-4">
            <input name="ci" type="text" placeholder="Cédula" required class="w-full px-3 py-2 border rounded" />
            <input name="nombre_completo" type="text" placeholder="Nombre completo" required class="w-full px-3 py-2 border rounded" />
            <input name="correo" type="email" placeholder="Correo electrónico" required class="w-full px-3 py-2 border rounded" />
            <input name="password" type="password" placeholder="Contraseña" required class="w-full px-3 py-2 border rounded" />
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Registrarse
      </button>
        </form>
        <p id="msg" class="mt-4 text-sm text-red-600"></p>
        <p class="mt-2 text-sm">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-blue-600">Inicia sesión</a></p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target).entries());

            const res = await fetch('/api/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                // Redirigir a la página de login tras un registro exitoso
                window.location.href = "{% url 'login' %}";
            } else {
                const msg = document.getElementById('msg');
                const err = await res.json();
                msg.textContent = '❌ ' + JSON.stringify(err);
            }
        });
    </script>
</body>

</html>
