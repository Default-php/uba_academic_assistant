{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-4">Iniciar Sesión</h2>

        {% if messages %}
        <div class="mb-4">
            {% for m in messages %}
            <p class="text-red-600">{{ m }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}?next={{ next|urlencode }}" class="space-y-4">
            {% csrf_token %}
            <input name="ci" type="text" placeholder="Cédula" required class="w-full px-3 py-2 border rounded" value="{{ request.POST.ci|default:'' }}" />
            <input name="password" type="password" placeholder="Contraseña" required class="w-full px-3 py-2 border rounded" />
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Entrar
      </button>
        </form>

        <p class="mt-4 text-sm">
            ¿No tienes cuenta?
            <a href="{% url 'register' %}" class="text-blue-600">Regístrate</a>
        </p>
    </div>
</body>

</html>
