{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-4">Iniciar Sesión</h2>
        <form id="login-form" class="space-y-4">
            <input name="ci" type="text" placeholder="Cédula" required class="w-full px-3 py-2 border rounded" />
            <input name="password" type="password" placeholder="Contraseña" required class="w-full px-3 py-2 border rounded" />
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Entrar
      </button>
        </form>
        <p id="msg" class="mt-4 text-sm text-red-600"></p>
        <p class="mt-2 text-sm">¿No tienes cuenta? <a href="{% url 'register' %}" class="text-blue-600">Regístrate</a></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target).entries());
            const res = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const msg = document.getElementById('msg');
            if (res.ok) {
                const {
                    access,
                    refresh
                } = await res.json();
                localStorage.setItem('access', access);
                localStorage.setItem('refresh', refresh);
                msg.classList.remove('text-red-600');
                msg.classList.add('text-green-600');
                msg.textContent = '✅ Sesión iniciada. Redirigiendo...';
                // redirige al dashboard:
                setTimeout(() => window.location.href = '/dashboard/', 800);
            } else {
                const err = await res.json();
                msg.textContent = '❌ ' + JSON.stringify(err);
            }
        });
    </script>
</body>

</html>
